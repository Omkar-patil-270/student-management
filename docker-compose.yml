services:
  student-management:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-management-app:latest
    container_name: student-management-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: unless-stopped
